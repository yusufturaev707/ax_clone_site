{% load i18n %}
{% load static %}

<div class="md3-header" id="md3Header">
    <!-- Menu Toggle (mobile) -->
    <button class="md3-menu-toggle" onclick="toggleSidebar()">
        <i class="material-icons">menu</i>
    </button>

    <!-- Title -->
    <div class="md3-header-title">
        {% trans "Test topshiriqlarini abrabatsiyadan o'tkazish" %}
    </div>

    <!-- Actions -->
    <div class="md3-header-actions">
        <div class="dropdown">
            <a href="#" class="md3-user-menu dropdown-toggle" data-toggle="dropdown">
                {% if request.user.avatar %}
                    <img src="{{ request.user.avatar }}" alt=""/>
                {% else %}
                    <img src="{% static 'img/no-image.png' %}" alt=""/>
                {% endif %}
                <span class="d-none d-md-inline">{{ request.user.full_name }}</span>
            </a>
            <div class="dropdown-menu dropdown-menu-right">
                <a href="{% url 'logout' %}" class="dropdown-item">
                    <i class="material-icons" style="font-size:18px;vertical-align:middle;margin-right:8px;">logout</i>
                    {% trans "Chiqish" %}
                </a>
            </div>
        </div>
    </div>
</div>
